<!DOCTYPE html>
<html>
<head>
	<title>CallApi</title>
	<style>
		h2 {
			color: blue;
		}

		.tlnk {
			text-decoration: underline;
			color: darkgreen;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<p style="margin: 12px 0 24px 0;">
		<a href="/c/index" style="display:inline-block;text-decoration:none;">
			<img style="display:inline-block;vertical-align:sub;" src="/c/res/MMLogo.svg" alt="Match Maker Education Labs Logo" width="200">
		</a>
	</p>
	<h2>Request</h2>
	<p id="templates">
		<strong>Templates:</strong>
	</p>
	<p><button id="clear">Clear</button></p>
	<form id="form" >
		<label for="verb">Verb:</label> <select id="verb" name="verb"><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option></select><br />
		<label for="url">URL:</label> <input id="url" name="url" type="text" style="width: 32em;" /><br />
		<label for="token">Authorization: Bearer</label> <input id="token" name="token" type="text" style="width: 34em;" /><br />
		<label for="authcookie">Credentials: Include</label> <input id="credinclude" name="credinclude" type="checkbox" /><br />
		<textarea id="body" name="body" cols="80" rows="10"></textarea><br />
		<button type="submit">Send</button>
	</form>
	<hr />
	<h2>Response</h2>
	<div id="resStatus"></div>
	<div id="resHeaders"></div>
	<pre id="resBody"></pre>
    <script type="module" src="/c/script/callapi.js"></script>

</body>
</html>
