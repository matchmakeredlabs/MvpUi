<h1>Maintenance</h1>
<ul>
    <li><a href="#" onclick="DeleteDemoDescriptors()">Delete Demo Descriptors</a></li>
</ul>
<div id="result"></div>

<script type="module">
    import { apiFetch, ensureApiResponse, getApiErrorMessage } from "/c/script/api-errors.js";
    window.DeleteDemoDescriptors = async function () {
        try {
        let res = await apiFetch("/Descriptors?provenance=Demo", {
            method: "DELETE"
        });
        await ensureApiResponse(res);
        if (res.ok) {
            document.getElementById("result").textContent = await res.text();
        }
        } catch (error) {
            document.getElementById("result").textContent = await getApiErrorMessage(error);
        }
    };
</script>
