---
title: Match Elements
---
<div class="mm_columns_header mm_columns">
    <div>
        <h1>Selected Element</h1>
        <article class="mmx_descriptorSearchForm"></article>
    </div>
    <div>
        <h1>
            Matching Elements
            <span style="font-size: 15px; display: inline-block; vertical-align: middle;">
                <mm-tooltip>
                <i id = "download-matches" class="fa-sharp fa-solid fa-download" slot="tooltip-button" ></i>
                <span slot="tooltip-content">Download Matches</span>
                </mm-tooltip>
            </span>
            <button id="match-console-button">Match Profile</button>
        </h1>
        <span class="mmx_descriptorMatchFilter">
        </span>    
    </div>
</div>
<div class="mm_columns_body mm_columns">
    <div>
        <article class="mmx_descriptorSearchDisplay"></article>
    </div>
    <div>
        <article class="mmx_descriptorMatchDisplay"></article>
    </div>
</div>

<mm-match-profile-modal></mm-match-profile-modal>
  
<div id="download-modal" class="modal_console">
  <div class="modal-content_console" style = "width: 400px;">
    <span class="close_console">&times;</span>
    <p style="padding-left: 50px;"> Only download matches with a MatchIndex above or equal to: <input id = "match-threshold" style="width: 30px;" value="0"/></p> 
    <div class="button-container-download">
      <div class="modal-button small-button5" id = "download-json">Download JSON</div>
      <br>
      <div class="modal-button small-button5" id = "download-csv">Download CSV</div>
    </div>
  </div> 
  </div>

<script type="module" src="/c/script/mmx_match.js"></script>
<script type="module" src="/c/script/mm-tooltip.js"></script>
<script src="https://kit.fontawesome.com/9e617e5901.js"></script>
