---
title: Login
autht: "anonymous"
---

<div class="auth-page">
    <form class="mmc_form auth-card" id="login_form">
        <h2>Sign In</h2>
        <div id="form_msg" class="message" aria-live="polite" style="visibility: hidden;"></div>
        <p><label for="username">Username:</label> <input type="text" name="username" id="username" autocomplete="username" /></p>
        <p><label for="password">Password:</label> <input type="password" name="password" id="password" autocomplete="current-password" /></p>
        <p class="auth-form-actions"><input style="cursor: pointer;" type="submit" value="Login"/></p>
        <p class="auth-toggle">
            Need an account?
            <button type="button" id="show_register" class="link-button">Create account</button>
        </p>
    </form>

    <mm-self-register-form id="register_form" hidden></mm-self-register-form>
</div>

<script type="module">

import config from '/config.js';
import bsession from '/c/script/bsession.js';
import '/c/script/mm-self-register-form.js';
const session = new bsession(config.backEndUrl, config.sessionTag);

async function login(un, pw) {

    const payload = {
        username: un,
        password: pw
    };

    let response = await session.fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });
    if (response.ok) {
        window.location.replace("/c/index");
    }
    else {
        let json = await response.json();
        let msgEle = document.getElementById("form_msg");
        msgEle.textContent = json.errors[0].detail;
        msgEle.style.color = "darkred";
        msgEle.style.visibility = "visible";
    }
}

function submitLogin(event) {
    event.preventDefault();
    console.log("submitLogin");
    let formData = new FormData(event.target);
    login(formData.get("username"), formData.get("password"));
}

document.getElementById("login_form").addEventListener("submit", submitLogin);
document.getElementById("show_register").addEventListener("click", () => {
    document.getElementById("login_form").hidden = true;
    document.getElementById("register_form").hidden = false;
});
document.getElementById("register_form").addEventListener("show-login", () => {
    document.getElementById("register_form").hidden = true;
    document.getElementById("login_form").hidden = false;
});
document.getElementById("register_form").addEventListener("registered", (event) => {
    document.getElementById("register_form").hidden = true;
    document.getElementById("login_form").hidden = false;
    document.getElementById("username").value = event.detail.email;
    const msgEle = document.getElementById("form_msg");
    msgEle.textContent = "Account created. Sign in to continue.";
    msgEle.style.color = "#5D9732";
    msgEle.style.visibility = "visible";
});
console.log("addEventListener complete")

</script>
