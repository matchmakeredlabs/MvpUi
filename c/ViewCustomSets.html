<head>
    <style>
        .filter {
            display: inline-block;
            background-color: #e0e0e0;
            font-size: 13px;
            padding: 0.1rem;
            margin: 0.1rem;
            border-radius: 2px;
        }

        .filter .close {
            margin-left: 2px;
            cursor: pointer;
        }

        .table-container {
                max-width: 1000px;
                margin: auto;
                overflow: hidden;
                padding: 20px;
                border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
        }

        th {
            background-color: #0068b3;
            color: white;
            padding: 15px 20px;
            text-align: left;
        }
        td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }            
    </style>
    <script type="module" src="/c/script/mmx_view_custom_sets.js">
    </script>

</head>
